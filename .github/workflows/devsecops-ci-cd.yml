name: DevSecOps CI/CD

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST Scan
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep ci --config p/ci || true

  sca-scan:
    name: SCA Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Resolve Maven dependencies with caching
        run: ./mvnw dependency:resolve --batch-mode

      - name: Download Trivy installer
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o install_trivy.sh
          sh install_trivy.sh -b /usr/local/bin
          rm -f install_trivy.sh

      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs . --scanners vuln,secret --exit-code 0 --severity CRITICAL,HIGH --offline-scan

  build-and-push:
    name: Build & Push Docker Images
    needs: [sast-scan, sca-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build Application JAR
        run: ./mvnw clean package -DskipTests

      - name: Locate and Copy JAR to Root
        run: |
          find . -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" -exec cp {} spring-petclinic.jar \;
          ls -la spring-petclinic.jar

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build, Tag, and Push Image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ecr-petclinic-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/Dockerfile \
            --build-arg ARTIFACT_NAME=spring-petclinic \
            --build-arg EXPOSED_PORT=8080 \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

  deploy:
    name: EKS Helm Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          aws-session-name: EKSDeploySession

      - name: Debug AWS Identity & Cluster Access
        run: |
          echo "=== AWS Caller Identity ==="
          aws sts get-caller-identity
          echo "=== Verifying kubectl access ==="
          aws eks update-kubeconfig --name eks-petclinic-prod --region ca-central-1
          kubectl get nodes --v=6

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Deploy Monitoring Stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --timeout 10m \
            -f helm/monitoring-values.yaml

      - name: Deploy Petclinic Application
        run: |
          helm upgrade --install petclinic-app helm \
            --namespace default \
            --set image.repository=128793514564.dkr.ecr.ca-central-1.amazonaws.com/ecr-petclinic-prod \
            --set image.tag=${{ github.sha }}

      - name: Get Application Endpoint
        run: |
          echo "Checking initial deployments status..."
          kubectl get deployments -n default

          echo "Waiting for deployments to be available..."
          if ! kubectl rollout status deployment/petclinic-api-gateway -n default --timeout=300s; then
            echo "=== DEPLOYMENT FAILED TO ROLL OUT. DESCRIBING PODS ==="
            kubectl describe pods -n default
            echo "=== RECENT CONTAINER LOGS ==="
            kubectl logs -l app.kubernetes.io/name=petclinic-api-gateway --tail=100 -n default || true
            exit 1
          fi

          echo "Establishing port-forward..."
          kubectl port-forward --address 0.0.0.0 svc/petclinic-api-gateway 8080:8080 -n default &
          
          echo "Waiting for tunnel readiness..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "Port-forward established successfully."
              exit 0
            fi
            sleep 1
          done
          echo "Error: Port-forward timed out."
          exit 1

      - name: Prepare ZAP Permissions & Artifacts
        run: |
          mkdir -p .zap
          touch .zap/rules.tsv
          sudo chmod -R 777 .zap
          sudo chmod -R 777 .

      - name: DAST Scan (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.12.0 # nosemgrep
        with:
          target: 'http://127.0.0.1:8080'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true