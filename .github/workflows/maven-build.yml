# maven-build.yml
#
# Java CI with Maven workflow for Spring Petclinic Microservices.
# Pins actions to full 40-character commit SHAs to pass Semgrep security rules.

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@b277d307127e2659e1f573c00edc606b297b4700 # v4.7.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml